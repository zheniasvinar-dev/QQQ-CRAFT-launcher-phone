name: Build APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble fullDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fullDebug APK
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Copy APK to out/
        run: |
          set -e
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/full/debug/*.apk out/QQQ-CRAFT-launcher-fullDebug.apk
          sha256sum out/QQQ-CRAFT-launcher-fullDebug.apk | tee out/apk_sha256.txt
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqqcraft-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Push APK parts to artifacts branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="apk-artifacts/${GITHUB_REF_NAME}"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p apk
          cp out/apk_sha256.txt apk/
          split -b 45M -d out/QQQ-CRAFT-launcher-fullDebug.apk apk/QCRAFT.apk.part_
          (cd apk && sha256sum * > checksums.txt)
          ls -la apk/
          git add apk
          git commit -m "APK build (run #${GITHUB_RUN_NUMBER}, ${{ github.sha }})"
          git push -f origin "$BRANCH:$BRANCH"
