name: Build APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble fullDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # main у цьому репозиторії не містить коду проєкту — чекаутимо гілку з кодом
          ref: arena/019f7f2d-qqq-craft-launcher-phone
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -ex
          df -h /
          find_sdkmanager() {
            for p in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
              /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager \
              "$ANDROID_HOME/tools/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ; do
              [ -x "$p" ] && { echo "$p"; return 0; }
            done
            return 1
          }
          SDKMANAGER=$(find_sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm /tmp/cmdtools.zip
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;29.0.14206865"
          df -h /

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fullDebug APK
        id: assemble
        run: |
          mkdir -p build-logs
          ( ./gradlew assembleFullDebug --stacktrace 2>&1 || touch BUILD_FAILED ) | tee build-logs/build.log

      - name: Publish build log to git
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="build-logs-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p log
          cp build-logs/build.log "log/build-run${GITHUB_RUN_NUMBER}.log"
          if [ -f BUILD_FAILED ]; then echo "BUILD FAILED" > log/STATUS; else echo "BUILD OK" > log/STATUS; fi
          git add log
          git commit -m "Build log (run #${GITHUB_RUN_NUMBER})" > /dev/null
          git push -f origin "$BRANCH:$BRANCH" || true
        shell: bash

      - name: Fail build step if needed
        if: always()
        run: |
          if [ -f BUILD_FAILED ]; then echo "Gradle build failed (see build-logs-* branch)"; exit 1; fi

      - name: Copy APK to out/
        run: |
          set -e
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/full/debug/*.apk out/QQQ-CRAFT-launcher-fullDebug.apk
          sha256sum out/QQQ-CRAFT-launcher-fullDebug.apk | tee out/apk_sha256.txt
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqqcraft-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Push APK parts to artifacts branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="apk-artifacts/${GITHUB_REF_NAME}"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p apk
          cp out/apk_sha256.txt apk/
          split -b 45M -d out/QQQ-CRAFT-launcher-fullDebug.apk apk/QCRAFT.apk.part_
          (cd apk && sha256sum * > checksums.txt)
          ls -la apk/
          git add apk
          git commit -m "APK build (run #${GITHUB_RUN_NUMBER}, ${{ github.sha }})"
          git push -f origin "$BRANCH:$BRANCH"
